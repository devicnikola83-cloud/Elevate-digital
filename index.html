<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>Elevate Digital · Affiliate-Portal</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,500;8..60,600;8..60,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.3.1/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.24.7/babel.min.js"></script>
<style>
  :root {
    --royal:    #1b3aa0;
    --royal-dk: #14267a;
    --royal-lt: #eef2fc;
    --ink:      #0f1a3a;
    --ink-2:    #46516f;
    --muted:    #7b859e;
    --line:     #e3e8f4;
    --line-2:   #d3daec;
    --white:    #ffffff;
    --paper:    #f7f9fd;
    --green:    #157f52;
    --green-bg: #e5f4ec;
    --amber:    #9a6a12;
    --amber-bg: #fbf1de;
    --red:      #b3283a;
    --red-bg:   #fbeaec;
    --shadow:   0 1px 2px rgba(15,26,58,.05), 0 8px 28px -14px rgba(15,26,58,.18);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    background: var(--paper);
    color: var(--ink);
    font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    -webkit-font-smoothing: antialiased;
    line-height: 1.5;
  }
  .serif { font-family: "Source Serif 4", Georgia, serif; }
  button { font-family: inherit; cursor: pointer; }
  input, select { font-family: inherit; }

  /* ---------- Shell ---------- */
  .topbar {
    background: var(--white); border-bottom: 1px solid var(--line);
    position: sticky; top: 0; z-index: 20;
  }
  .topbar-in {
    max-width: 1080px; margin: 0 auto; padding: 0 20px; height: 64px;
    display: flex; align-items: center; justify-content: space-between; gap: 16px;
  }
  .logo { display: flex; align-items: center; gap: 12px; }
  .crest {
    width: 38px; height: 38px; border-radius: 9px; flex: none;
    background: var(--royal); color: #fff; display: grid; place-items: center;
    font-family: "Source Serif 4", serif; font-weight: 700; font-size: 17px;
    letter-spacing: 0.02em;
  }
  .logo .name { font-weight: 700; font-size: 15px; letter-spacing: -0.01em; }
  .logo .sub { font-size: 11px; color: var(--muted); letter-spacing: 0.06em; text-transform: uppercase; }
  .top-right { display: flex; align-items: center; gap: 14px; }
  .whoami { text-align: right; line-height: 1.25; }
  .whoami .n { font-weight: 600; font-size: 13px; }
  .whoami .r { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.05em; }

  .page { max-width: 1080px; margin: 0 auto; padding: 28px 20px 80px; }

  /* ---------- Buttons ---------- */
  .btn {
    border: 1px solid var(--royal); background: var(--royal); color: #fff;
    font-weight: 600; font-size: 14px; padding: 10px 18px; border-radius: 9px;
    transition: background .15s ease, border-color .15s ease, opacity .15s;
    display: inline-flex; align-items: center; gap: 8px; white-space: nowrap;
  }
  .btn:hover { background: var(--royal-dk); border-color: var(--royal-dk); }
  .btn:disabled { opacity: .45; cursor: not-allowed; }
  .btn.ghost { background: transparent; color: var(--royal); }
  .btn.ghost:hover { background: var(--royal-lt); }
  .btn.line { background: #fff; color: var(--ink); border-color: var(--line-2); }
  .btn.line:hover { background: var(--paper); border-color: var(--muted); }
  .btn.sm { padding: 7px 13px; font-size: 12.5px; border-radius: 8px; }
  .btn.ok { background: var(--green); border-color: var(--green); }
  .btn.ok:hover { filter: brightness(.93); }
  .btn.danger { background: #fff; color: var(--red); border-color: var(--line-2); }
  .btn.danger:hover { background: var(--red-bg); border-color: var(--red); }

  /* ---------- Cards ---------- */
  .card {
    background: var(--white); border: 1px solid var(--line);
    border-radius: 14px; box-shadow: var(--shadow);
  }
  .card-pad { padding: 22px; }
  .card-head {
    padding: 18px 22px; border-bottom: 1px solid var(--line);
    display: flex; align-items: center; justify-content: space-between; gap: 12px;
  }
  .card-head h3 { font-size: 15px; font-weight: 700; letter-spacing: -0.01em; }
  .card-head .hint { font-size: 12px; color: var(--muted); }
  .eyebrow {
    font-size: 11px; font-weight: 700; letter-spacing: 0.14em; text-transform: uppercase;
    color: var(--royal); margin-bottom: 14px;
  }

  /* ---------- Landing ---------- */
  .hero { padding: 70px 0 40px; max-width: 720px; }
  .hero .kicker {
    font-size: 12px; font-weight: 700; letter-spacing: 0.16em; text-transform: uppercase;
    color: var(--royal); margin-bottom: 20px;
  }
  .hero h1 {
    font-size: clamp(34px, 6vw, 54px); font-weight: 700; line-height: 1.06;
    letter-spacing: -0.02em; color: var(--ink);
  }
  .hero p {
    font-size: clamp(16px, 2.4vw, 19px); color: var(--ink-2); margin: 22px 0 32px;
    max-width: 560px;
  }
  .hero-cta { display: flex; gap: 12px; flex-wrap: wrap; align-items: center; }
  .rule { height: 1px; background: var(--line); margin: 8px 0 0; }
  .feats {
    display: grid; grid-template-columns: repeat(3, 1fr); gap: 1px;
    background: var(--line); border: 1px solid var(--line); border-radius: 14px;
    overflow: hidden; margin-top: 48px;
  }
  .feat { background: #fff; padding: 26px 22px; }
  .feat .no {
    font-family: "Source Serif 4", serif; font-size: 13px; color: var(--royal);
    font-weight: 600; letter-spacing: 0.05em;
  }
  .feat h4 { font-size: 16px; font-weight: 700; margin: 12px 0 7px; }
  .feat p { font-size: 13.5px; color: var(--ink-2); line-height: 1.55; }

  /* ---------- Login ---------- */
  .login-wrap { max-width: 440px; margin: 60px auto 0; }
  .login-wrap .lead { text-align: center; margin-bottom: 28px; }
  .login-wrap .lead h2 { font-size: 26px; font-weight: 700; letter-spacing: -0.01em; }
  .login-wrap .lead p { color: var(--ink-2); font-size: 14px; margin-top: 8px; }
  .acct-list { display: flex; flex-direction: column; gap: 10px; }
  .acct {
    display: flex; align-items: center; gap: 14px; width: 100%; text-align: left;
    background: #fff; border: 1px solid var(--line); border-radius: 12px;
    padding: 14px 16px; transition: border-color .15s, box-shadow .15s;
  }
  .acct:hover { border-color: var(--royal); box-shadow: var(--shadow); }
  .avatar {
    width: 42px; height: 42px; border-radius: 11px; flex: none; display: grid;
    place-items: center; font-weight: 700; font-size: 15px; letter-spacing: .01em;
    background: var(--royal-lt); color: var(--royal);
  }
  .avatar.admin { background: var(--royal); color: #fff; }
  .avatar.lg { width: 54px; height: 54px; font-size: 19px; border-radius: 14px; }
  .acct .a-name { font-weight: 600; font-size: 15px; }
  .acct .a-role { font-size: 12px; color: var(--muted); }
  .acct .chev { margin-left: auto; color: var(--muted); font-size: 18px; }
  .login-note {
    margin-top: 20px; font-size: 12px; color: var(--muted); text-align: center;
    line-height: 1.55;
  }

  /* ---------- Stats ---------- */
  .stat-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 14px; }
  .stat {
    background: #fff; border: 1px solid var(--line); border-radius: 13px; padding: 18px;
    box-shadow: var(--shadow);
  }
  .stat .lab { font-size: 11.5px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: 0.06em; }
  .stat .num { font-family: "Source Serif 4", serif; font-size: 30px; font-weight: 700; letter-spacing: -0.01em; margin-top: 6px; color: var(--ink); }
  .stat .num.blue { color: var(--royal); }
  .stat .num.green { color: var(--green); }
  .stat .num.amber { color: var(--amber); }
  .stat .foot { font-size: 12px; color: var(--muted); margin-top: 4px; }

  .section-title { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; margin: 34px 0 14px; }
  .section-title h2 { font-size: 19px; font-weight: 700; letter-spacing: -0.01em; }
  .section-title .meta { font-size: 12.5px; color: var(--muted); }

  /* ---------- Form ---------- */
  .field { margin-bottom: 14px; }
  .field label { display: block; font-size: 12.5px; font-weight: 600; color: var(--ink-2); margin-bottom: 6px; }
  .field input, .field select {
    width: 100%; border: 1px solid var(--line-2); border-radius: 9px; padding: 11px 12px;
    font-size: 14px; color: var(--ink); background: #fff; transition: border-color .15s, box-shadow .15s;
  }
  .field input:focus, .field select:focus {
    outline: none; border-color: var(--royal); box-shadow: 0 0 0 3px rgba(27,58,160,.12);
  }
  .form-row { display: grid; grid-template-columns: 1fr 130px; gap: 14px; }
  .err { color: var(--red); font-size: 12.5px; margin-top: 2px; }

  /* ---------- Table / list ---------- */
  .sale { border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; background: #fff; }
  .sale + .sale { margin-top: 10px; }
  .sale-top { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; }
  .sale .client { font-weight: 600; font-size: 15px; }
  .sale .type { font-size: 12.5px; color: var(--ink-2); margin-top: 2px; }
  .sale .price { font-family: "Source Serif 4", serif; font-size: 19px; font-weight: 700; }
  .sale-bottom {
    display: flex; align-items: center; justify-content: space-between; gap: 12px;
    margin-top: 13px; padding-top: 13px; border-top: 1px solid var(--line); flex-wrap: wrap;
  }
  .sale .who-tag { font-size: 12px; color: var(--muted); }
  .actions { display: flex; gap: 8px; flex-wrap: wrap; }

  .badge {
    display: inline-flex; align-items: center; gap: 6px; font-size: 11.5px; font-weight: 600;
    padding: 4px 10px; border-radius: 999px; letter-spacing: 0.01em;
  }
  .badge::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
  .badge.open  { color: var(--amber); background: var(--amber-bg); }
  .badge.done  { color: var(--royal); background: var(--royal-lt); }
  .badge.confirmed { color: var(--green); background: var(--green-bg); }
  .team-tag { font-size: 11px; font-weight: 600; color: var(--muted); }

  .commission {
    font-family: "Source Serif 4", serif; font-weight: 700; font-size: 15px;
  }
  .commission.paid { color: var(--green); }
  .commission.pending { color: var(--muted); font-family: "Inter", sans-serif; font-weight: 500; font-size: 13px; }

  /* ---------- Leaderboard ---------- */
  .lb-row {
    display: grid; grid-template-columns: 34px 44px 1fr auto; align-items: center; gap: 14px;
    padding: 14px 6px; border-bottom: 1px solid var(--line);
  }
  .lb-row:last-child { border-bottom: none; }
  .lb-rank { font-family: "Source Serif 4", serif; font-size: 17px; font-weight: 700; color: var(--muted); text-align: center; }
  .lb-row.first .lb-rank { color: var(--royal); }
  .lb-row.first .avatar { background: var(--royal); color: #fff; }
  .lb-name { font-weight: 600; font-size: 15px; }
  .lb-sub { font-size: 12px; color: var(--muted); }
  .lb-fig { text-align: right; }
  .lb-fig .rev { font-family: "Source Serif 4", serif; font-weight: 700; font-size: 17px; }
  .lb-fig .dl { font-size: 12px; color: var(--muted); margin-top: 1px; }

  .empty { text-align: center; padding: 40px 20px; color: var(--muted); }
  .empty .big { font-family: "Source Serif 4", serif; font-size: 17px; color: var(--ink-2); margin-bottom: 6px; }
  .empty p { font-size: 13.5px; }

  .grid-2 { display: grid; grid-template-columns: 360px 1fr; gap: 20px; align-items: start; }
  .filters { display: flex; gap: 8px; flex-wrap: wrap; }
  .chip {
    border: 1px solid var(--line-2); background: #fff; color: var(--ink-2);
    font-size: 12.5px; font-weight: 600; padding: 6px 13px; border-radius: 999px;
  }
  .chip.on { background: var(--royal); border-color: var(--royal); color: #fff; }

  footer.site { border-top: 1px solid var(--line); background: #fff; }
  footer.site .in { max-width: 1080px; margin: 0 auto; padding: 22px 20px; font-size: 12.5px; color: var(--muted); display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; }

  @media (max-width: 860px) {
    .feats { grid-template-columns: 1fr; }
    .grid-2 { grid-template-columns: 1fr; }
  }
  @media (max-width: 480px) {
    .form-row { grid-template-columns: 1fr; }
    .whoami { display: none; }
  }
</style>
</head>
<body>
<div id="root"></div>

<script type="text/babel">
const { useState, useMemo } = React;

/* ============================================================
   KONFIG — Provisionsmodelle & Team
   (Team = echte Personen. Verkaufszahlen: keine. Alles startet leer.)
   ============================================================ */
const RATE = { website: 0.20, nfc: 0.60, backend: 0.10 };
const TYPES = [
  { id: "website", label: "Webdesign / Local-SEO Setup", rate: "20 %" },
  { id: "nfc",     label: "NFC-Bewertungsaufsteller",     rate: "60 %" },
  { id: "backend", label: "Backend Cross-Sell (Website nach NFC)", rate: "10 %" },
];
const TYPE_LABEL = Object.fromEntries(TYPES.map(t => [t.id, t.label]));

const TEAM = [
  { id: "nikola", name: "Nikola", role: "admin",     initials: "ND", team: "Geschäftsführung" },
  { id: "jason",  name: "Jason",  role: "affiliate", initials: "JA", team: "Cold Calling" },
  { id: "gregor", name: "Gregor", role: "affiliate", initials: "GR", team: "Cold Calling" },
  { id: "justus", name: "Justus", role: "affiliate", initials: "JU", team: "Door-to-Door" },
  { id: "oskar",  name: "Oskar",  role: "affiliate", initials: "OS", team: "Door-to-Door · Frankfurt" },
];
const affiliates = () => TEAM.filter(u => u.role === "affiliate");

/* ---------- Helpers ---------- */
const fmtEur = n => new Intl.NumberFormat("de-DE", { style: "currency", currency: "EUR", maximumFractionDigits: 0 }).format(n);
const commissionFor = s => Math.round(s.price * (RATE[s.type] || 0));
const repOf = id => TEAM.find(u => u.id === id);

const STATUS = {
  open:      { cls: "open",      label: "Offen" },
  done:      { cls: "done",      label: "Abgeschlossen" },
  confirmed: { cls: "confirmed", label: "Bestätigt" },
};

/* ============================================================
   TOPBAR
   ============================================================ */
function Topbar({ user, onLogout, onLogin }) {
  return (
    <div className="topbar">
      <div className="topbar-in">
        <div className="logo">
          <div className="crest serif">ED</div>
          <div>
            <div className="name">Elevate Digital</div>
            <div className="sub">Affiliate-Portal</div>
          </div>
        </div>
        <div className="top-right">
          {user ? (
            <>
              <div className="whoami">
                <div className="n">{user.name}</div>
                <div className="r">{user.role === "admin" ? "Administrator" : user.team}</div>
              </div>
              <div className={"avatar" + (user.role === "admin" ? " admin" : "")}>{user.initials}</div>
              <button className="btn line sm" onClick={onLogout}>Abmelden</button>
            </>
          ) : (
            <button className="btn" onClick={onLogin}>Anmelden</button>
          )}
        </div>
      </div>
    </div>
  );
}

/* ============================================================
   LANDING
   ============================================================ */
function Landing({ onLogin }) {
  return (
    <div className="page">
      <section className="hero">
        <div className="kicker">Elevate Digital · eine Marke der Devic Industries</div>
        <h1 className="serif">Das Portal für unser Vertriebsteam.</h1>
        <p>
          Trage deine Verkäufe ein, verfolge den Status jeder Provision und sieh in Echtzeit,
          wo du im Team stehst. Transparent, sauber abgerechnet — jeder Abschluss zählt,
          sobald er bestätigt ist.
        </p>
        <div className="hero-cta">
          <button className="btn" onClick={onLogin}>Anmelden</button>
          <span style={{ fontSize: "13px", color: "var(--muted)" }}>Zugang nur für Team-Mitglieder</span>
        </div>
      </section>

      <div className="feats">
        <div className="feat">
          <div className="no serif">Erstens</div>
          <h4>Verkäufe eintragen</h4>
          <p>Auftrag rein, Kunde und Verkaufspreis erfassen. Ob NFC-Aufsteller, Website-Setup oder Cross-Sell — das Modell erkennt die Provision automatisch.</p>
        </div>
        <div className="feat">
          <div className="no serif">Zweitens</div>
          <h4>Provision nach Bestätigung</h4>
          <p>Deine Provision wird sichtbar, sobald der Abschluss steht und von der Geschäftsführung bestätigt wurde. Keine Luftbuchungen.</p>
        </div>
        <div className="feat">
          <div className="no serif">Drittens</div>
          <h4>Das Live-Ranking</h4>
          <p>Bestätigter Umsatz aller Closer auf einen Blick. Wer liefert, steht oben — sichtbar fürs ganze Team.</p>
        </div>
      </div>
    </div>
  );
}

/* ============================================================
   LOGIN (Platzhalter — wird später durch Netlify Identity ersetzt)
   ============================================================ */
function Login({ onPick }) {
  return (
    <div className="page">
      <div className="login-wrap">
        <div className="lead">
          <h2 className="serif">Anmelden</h2>
          <p>Wähle deinen Account, um fortzufahren.</p>
        </div>
        <div className="acct-list">
          {TEAM.map(u => (
            <button key={u.id} className="acct" onClick={() => onPick(u)}>
              <div className={"avatar" + (u.role === "admin" ? " admin" : "")}>{u.initials}</div>
              <div>
                <div className="a-name">{u.name}</div>
                <div className="a-role">{u.role === "admin" ? "Administrator · Geschäftsführung" : u.team}</div>
              </div>
              <div className="chev">›</div>
            </button>
          ))}
        </div>
        <div className="login-note">
          Vorläufige Anmeldung für die Entwicklung. In der Live-Version läuft das über
          echte Accounts mit Passwort (Netlify Identity).
        </div>
      </div>
    </div>
  );
}

/* ============================================================
   LEADERBOARD (bestätigter Umsatz, für alle sichtbar)
   ============================================================ */
function Leaderboard({ sales }) {
  const ranked = useMemo(() => {
    const map = {};
    affiliates().forEach(u => (map[u.id] = { ...u, revenue: 0, deals: 0 }));
    sales.filter(s => s.status === "confirmed").forEach(s => {
      const r = map[s.repId];
      if (!r) return;
      r.revenue += s.price;
      r.deals += 1;
    });
    return Object.values(map).sort((a, b) => b.revenue - a.revenue);
  }, [sales]);

  const anyRevenue = ranked.some(r => r.revenue > 0);

  return (
    <div className="card">
      <div className="card-head">
        <h3>Leaderboard</h3>
        <span className="hint">Bestätigter Umsatz · {new Date().toLocaleDateString("de-DE", { month: "long", year: "numeric" })}</span>
      </div>
      <div className="card-pad" style={{ paddingTop: 6, paddingBottom: 6 }}>
        {!anyRevenue ? (
          <div className="empty">
            <div className="big serif">Noch nichts bestätigt</div>
            <p>Sobald der erste Abschluss bestätigt ist, erscheint er hier.</p>
          </div>
        ) : (
          ranked.map((r, i) => (
            <div key={r.id} className={"lb-row" + (i === 0 ? " first" : "")}>
              <div className="lb-rank">{i + 1}</div>
              <div className="avatar">{r.initials}</div>
              <div>
                <div className="lb-name">{r.name}</div>
                <div className="lb-sub">{r.team}</div>
              </div>
              <div className="lb-fig">
                <div className="rev">{fmtEur(r.revenue)}</div>
                <div className="dl">{r.deals} {r.deals === 1 ? "Abschluss" : "Abschlüsse"}</div>
              </div>
            </div>
          ))
        )}
      </div>
    </div>
  );
}

/* ============================================================
   AFFILIATE DASHBOARD
   ============================================================ */
function AffiliateDashboard({ user, sales, addSale, markDone, removeSale }) {
  const mine = sales.filter(s => s.repId === user.id)
    .sort((a, b) => b.createdAt - a.createdAt);

  const myConfirmed = mine.filter(s => s.status === "confirmed");
  const myRevenue = myConfirmed.reduce((s, x) => s + x.price, 0);
  const myCommission = myConfirmed.reduce((s, x) => s + commissionFor(x), 0);
  const pending = mine.filter(s => s.status !== "confirmed").length;

  return (
    <div className="page">
      <div className="section-title">
        <h2 className="serif">Willkommen, {user.name}.</h2>
        <span className="meta">{user.team}</span>
      </div>

      <div className="stat-grid">
        <div className="stat">
          <div className="lab">Bestätigter Umsatz</div>
          <div className="num blue">{fmtEur(myRevenue)}</div>
          <div className="foot">{myConfirmed.length} bestätigte Abschlüsse</div>
        </div>
        <div className="stat">
          <div className="lab">Deine Provision</div>
          <div className="num green">{fmtEur(myCommission)}</div>
          <div className="foot">ausgezahlt / freigegeben</div>
        </div>
        <div className="stat">
          <div className="lab">In Bearbeitung</div>
          <div className="num amber">{pending}</div>
          <div className="foot">offen oder wartet auf Bestätigung</div>
        </div>
      </div>

      <div className="grid-2" style={{ marginTop: 24 }}>
        <SaleForm user={user} addSale={addSale} />
        <div>
          <div className="card" style={{ marginBottom: 20 }}>
            <div className="card-head">
              <h3>Meine Verkäufe</h3>
              <span className="hint">{mine.length} Einträge</span>
            </div>
            <div className="card-pad">
              {mine.length === 0 ? (
                <div className="empty">
                  <div className="big serif">Noch keine Verkäufe</div>
                  <p>Trage links deinen ersten Abschluss ein.</p>
                </div>
              ) : (
                mine.map(s => (
                  <SaleCard key={s.id} sale={s} view="affiliate"
                    onDone={() => markDone(s.id)} onRemove={() => removeSale(s.id)} />
                ))
              )}
            </div>
          </div>
          <Leaderboard sales={sales} />
        </div>
      </div>
    </div>
  );
}

function SaleForm({ user, addSale }) {
  const [client, setClient] = useState("");
  const [type, setType] = useState("website");
  const [price, setPrice] = useState("");
  const [err, setErr] = useState("");

  const submit = () => {
    const p = parseFloat(String(price).replace(",", "."));
    if (!client.trim()) return setErr("Bitte Kundennamen eintragen.");
    if (!p || p <= 0) return setErr("Bitte einen gültigen Verkaufspreis eintragen.");
    addSale({ repId: user.id, client: client.trim(), type, price: Math.round(p) });
    setClient(""); setPrice(""); setType("website"); setErr("");
  };

  return (
    <div className="card card-pad" style={{ position: "sticky", top: 84 }}>
      <div className="eyebrow">Verkauf eintragen</div>
      <div className="field">
        <label>Kunde</label>
        <input value={client} placeholder="z. B. Pizzeria Da Enzo"
          onChange={e => setClient(e.target.value)} />
      </div>
      <div className="field">
        <label>Art des Verkaufs</label>
        <select value={type} onChange={e => setType(e.target.value)}>
          {TYPES.map(t => <option key={t.id} value={t.id}>{t.label} ({t.rate})</option>)}
        </select>
      </div>
      <div className="field">
        <label>Verkaufspreis (netto)</label>
        <input value={price} inputMode="decimal" placeholder="z. B. 700"
          onChange={e => setPrice(e.target.value)}
          onKeyDown={e => e.key === "Enter" && submit()} />
      </div>
      {err && <div className="err">{err}</div>}
      <button className="btn" style={{ width: "100%", justifyContent: "center", marginTop: 6 }} onClick={submit}>
        Eintragen
      </button>
      <p style={{ fontSize: "12px", color: "var(--muted)", marginTop: 12, lineHeight: 1.5 }}>
        Deine Provision erscheint, sobald der Abschluss bestätigt wurde.
      </p>
    </div>
  );
}

/* ============================================================
   ADMIN DASHBOARD
   ============================================================ */
function AdminDashboard({ sales, markDone, confirmSale, unconfirmSale, removeSale }) {
  const [filter, setFilter] = useState("all");

  const confirmed = sales.filter(s => s.status === "confirmed");
  const totalRevenue = confirmed.reduce((s, x) => s + x.price, 0);
  const totalCommission = confirmed.reduce((s, x) => s + commissionFor(x), 0);
  const awaiting = sales.filter(s => s.status === "done").length;

  const filtered = sales
    .filter(s => filter === "all" ? true : s.status === filter)
    .sort((a, b) => {
      const order = { done: 0, open: 1, confirmed: 2 };
      if (order[a.status] !== order[b.status]) return order[a.status] - order[b.status];
      return b.createdAt - a.createdAt;
    });

  const counts = {
    all: sales.length,
    done: sales.filter(s => s.status === "done").length,
    open: sales.filter(s => s.status === "open").length,
    confirmed: confirmed.length,
  };

  return (
    <div className="page">
      <div className="section-title">
        <h2 className="serif">Admin · Übersicht</h2>
        <span className="meta">Alle Verkäufe des Teams</span>
      </div>

      <div className="stat-grid">
        <div className="stat">
          <div className="lab">Bestätigter Umsatz</div>
          <div className="num blue">{fmtEur(totalRevenue)}</div>
          <div className="foot">{confirmed.length} Abschlüsse</div>
        </div>
        <div className="stat">
          <div className="lab">Provision (Auszahlung)</div>
          <div className="num green">{fmtEur(totalCommission)}</div>
          <div className="foot">freigegeben ans Team</div>
        </div>
        <div className="stat">
          <div className="lab">Wartet auf Bestätigung</div>
          <div className="num amber">{awaiting}</div>
          <div className="foot">abgeschlossen, ungeprüft</div>
        </div>
        <div className="stat">
          <div className="lab">Einträge gesamt</div>
          <div className="num">{sales.length}</div>
          <div className="foot">alle Status</div>
        </div>
      </div>

      <div className="grid-2" style={{ marginTop: 24 }}>
        <div>
          <Leaderboard sales={sales} />
        </div>
        <div className="card">
          <div className="card-head">
            <h3>Verkäufe verwalten</h3>
            <div className="filters">
              {[["all","Alle"],["done","Zu bestätigen"],["open","Offen"],["confirmed","Bestätigt"]].map(([k,l]) => (
                <button key={k} className={"chip" + (filter === k ? " on" : "")} onClick={() => setFilter(k)}>
                  {l} · {counts[k]}
                </button>
              ))}
            </div>
          </div>
          <div className="card-pad">
            {filtered.length === 0 ? (
              <div className="empty">
                <div className="big serif">Nichts hier</div>
                <p>{sales.length === 0 ? "Sobald das Team Verkäufe einträgt, erscheinen sie hier." : "Kein Eintrag mit diesem Status."}</p>
              </div>
            ) : (
              filtered.map(s => (
                <SaleCard key={s.id} sale={s} view="admin"
                  onDone={() => markDone(s.id)}
                  onConfirm={() => confirmSale(s.id)}
                  onUnconfirm={() => unconfirmSale(s.id)}
                  onRemove={() => removeSale(s.id)} />
              ))
            )}
          </div>
        </div>
      </div>
    </div>
  );
}

/* ============================================================
   SALE CARD (geteilt: Affiliate + Admin)
   ============================================================ */
function SaleCard({ sale, view, onDone, onConfirm, onUnconfirm, onRemove }) {
  const st = STATUS[sale.status];
  const rep = repOf(sale.repId);
  const isConfirmed = sale.status === "confirmed";

  return (
    <div className="sale">
      <div className="sale-top">
        <div>
          <div className="client">{sale.client}</div>
          <div className="type">{TYPE_LABEL[sale.type]}</div>
        </div>
        <div className="price">{fmtEur(sale.price)}</div>
      </div>
      <div className="sale-bottom">
        <div style={{ display: "flex", alignItems: "center", gap: 12, flexWrap: "wrap" }}>
          <span className={"badge " + st.cls}>{st.label}</span>
          {view === "admin" && <span className="who-tag">{rep ? rep.name : "?"} · {rep ? rep.team : ""}</span>}
          {isConfirmed
            ? <span className="commission paid">Provision {fmtEur(commissionFor(sale))}</span>
            : <span className="commission pending">Provision ausstehend</span>}
        </div>

        <div className="actions">
          {view === "affiliate" && sale.status === "open" && (
            <>
              <button className="btn ok sm" onClick={onDone}>Als abgeschlossen melden</button>
              <button className="btn danger sm" onClick={onRemove}>Löschen</button>
            </>
          )}
          {view === "affiliate" && sale.status === "done" && (
            <span style={{ fontSize: "12.5px", color: "var(--muted)" }}>Wartet auf Bestätigung durch Nikola</span>
          )}

          {view === "admin" && sale.status === "open" && (
            <button className="btn line sm" onClick={onDone}>Als abgeschlossen markieren</button>
          )}
          {view === "admin" && sale.status === "done" && (
            <button className="btn ok sm" onClick={onConfirm}>Bestätigen</button>
          )}
          {view === "admin" && sale.status === "confirmed" && (
            <button className="btn line sm" onClick={onUnconfirm}>Bestätigung widerrufen</button>
          )}
          {view === "admin" && (
            <button className="btn danger sm" onClick={onRemove}>Löschen</button>
          )}
        </div>
      </div>
    </div>
  );
}

/* ============================================================
   APP ROOT
   ============================================================ */
function App() {
  const [screen, setScreen] = useState("landing");   // landing | login
  const [user, setUser] = useState(null);
  const [sales, setSales] = useState([]);            // startet leer — keine erfundenen Zahlen
  const [seq, setSeq] = useState(1);

  const addSale = ({ repId, client, type, price }) => {
    setSales(prev => [...prev, { id: seq, repId, client, type, price, status: "open", createdAt: Date.now() }]);
    setSeq(n => n + 1);
  };
  const setStatus = (id, status) => setSales(prev => prev.map(s => s.id === id ? { ...s, status } : s));
  const markDone      = id => setStatus(id, "done");
  const confirmSale   = id => setStatus(id, "confirmed");
  const unconfirmSale = id => setStatus(id, "done");
  const removeSale    = id => setSales(prev => prev.filter(s => s.id !== id));

  const logout = () => { setUser(null); setScreen("landing"); };

  let body;
  if (!user) {
    body = screen === "login"
      ? <Login onPick={u => { setUser(u); setScreen("landing"); }} />
      : <Landing onLogin={() => setScreen("login")} />;
  } else if (user.role === "admin") {
    body = <AdminDashboard sales={sales}
      markDone={markDone} confirmSale={confirmSale} unconfirmSale={unconfirmSale} removeSale={removeSale} />;
  } else {
    body = <AffiliateDashboard user={user} sales={sales}
      addSale={addSale} markDone={markDone} removeSale={removeSale} />;
  }

  return (
    <>
      <Topbar user={user} onLogout={logout} onLogin={() => setScreen("login")} />
      {body}
      <footer className="site">
        <div className="in">
          <span>© {new Date().getFullYear()} Elevate Digital — eine Marke der Devic Industries</span>
          <span>Bad Homburg · Frankfurt</span>
        </div>
      </footer>
    </>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
