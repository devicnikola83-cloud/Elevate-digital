  .btn { border:1px solid var(--royal); background:var(--royal); color:#fff; font-weight:600; font-size:14px;

  .btn.danger { background:#fff; color:var(--red); border-color:var(--line-2); }

  .map-hint { font-size:12.5px; color:var(--muted); margin-bottom:12px; }
  code { background:#e4e9f4; padding:1px 5px; border-radius:4px; font-size:12px; }

  .mini { display:flex; flex-direction:column; gap:4px; }

<div id="root"></div>

<script type="text/babel">
const { useState, useEffect, useMemo, useCallback, useRef } = React;

/* ============================================================
   >>> HIER DEINEN GEOAPIFY-SCHLUESSEL EINFUEGEN <<<
   Kostenlos & ohne Kreditkarte: https://myprojects.geoapify.com
   ============================================================ */
const GEOAPIFY_KEY = "656df0a1940941f18f1a714b5979282b";

const SALES_API = "/.netlify/functions/sales";
const LEADS_API = "/.netlify/functions/leads";
const CAP_API = "/.netlify/functions/capacity";
const RATE = { website: 0.20, nfc: 0.60, backend: 0.10 };
const TYPES = [
  { id:"website", label:"Webdesign / Local-SEO Setup", rate:"20 %" },
  { id:"nfc",     label:"NFC-Bewertungsaufsteller",     rate:"60 %" },
  { id:"backend", label:"Backend Cross-Sell (Website nach NFC)", rate:"10 %" },
];
const TYPE_LABEL = Object.fromEntries(TYPES.map(t => [t.id, t.label]));
const SALE_STATUS = { open:{cls:"open",label:"Offen"}, done:{cls:"done",label:"Abgeschlossen"}, confirmed:{cls:"confirmed",label:"Bestätigt"} };

const LEAD_STATUS = [
  { id:"neu", label:"Neu" },
  { id:"interessiert", label:"Interessiert" },
  { id:"nicht_interessiert", label:"Nicht interessiert" },
  { id:"termin", label:"Termin" },
  { id:"verkauft", label:"Verkauft" },
];
const LEAD_STATUS_LABEL = Object.fromEntries(LEAD_STATUS.map(s => [s.id, s.label]));
const WEBSITE_OPTS = [
  { id:"unbekannt", label:"Unbekannt" },
  { id:"interessiert", label:"Interessiert" },
  { id:"vielleicht", label:"Vielleicht" },
  { id:"nicht_interessiert", label:"Nicht interessiert" },
];
const WEBSITE_LABEL = Object.fromEntries(WEBSITE_OPTS.map(s => [s.id, s.label]));

const fmtEur = n => new Intl.NumberFormat("de-DE",{style:"currency",currency:"EUR",maximumFractionDigits:0}).format(n||0);
const commissionFor = s => Math.round(s.price * (RATE[s.type] || 0));
const initialsOf = name => {
  const p = (name||"").trim().split(/\s+/);
  return (((p[0]||"")[0]||"") + ((p[1]||"")[0] || (p[0]||"")[1] || "")).toUpperCase() || "?";
};

/* ---------- API ---------- */
async function authHeader() {
  const u = window.netlifyIdentity && window.netlifyIdentity.currentUser();
  if (!u) return {};
  await u.jwt();
  const token = u.token && u.token.access_token;
  return token ? { Authorization: "Bearer " + token } : {};
}
async function apiGet(url) {
  const r = await fetch(url, { headers: await authHeader() });
  if (!r.ok) throw new Error("Status " + r.status);
  return r.json();
}
async function apiSend(url, method, body, qs) {
  const r = await fetch(qs ? url + "?" + qs : url, {
    method,
    headers: { ...(await authHeader()), "Content-Type":"application/json" },
    body: body ? JSON.stringify(body) : undefined,
  });
  if (!r.ok) { let m=""; try { m=(await r.json()).error||""; } catch(e){} throw new Error(m || ("Status "+r.status)); }
  return r.json();
}

/* ============================================================ */
const toastListeners = new Set();
let toastSeq = 1;
function pushToast(text, type = "ok") {
  const t = { id: toastSeq++, text, type };
  toastListeners.forEach(fn => fn(t));
}
function Toaster() {
  const [items, setItems] = useState([]);
  useEffect(() => {
    const on = (t) => {
      setItems(prev => [...prev, t]);
      setTimeout(() => setItems(prev => prev.filter(x => x.id !== t.id)), 2600);
    };
    toastListeners.add(on);
    return () => toastListeners.delete(on);
  }, []);
  return <div className="toaster">{items.map(t => <div key={t.id} className={"toast " + t.type}>{t.text}</div>)}</div>;
}

function Topbar({ user, role }) {

    <div className="topbar"><div className="topbar-in">
      <div className="logo">
        <div className="crest serif">ED</div>
        <div><div className="name">Elevate Digital</div><div className="sub">Team-Portal</div></div>
      </div>
      <div className="top-right">
        {user ? (<>
          <div className="whoami">
            <div className="n">{user.user_metadata?.full_name || user.email}</div>
            <div className="r">{role === "admin" ? "Administrator" : "Affiliate"}</div>
          </div>
          <div className={"avatar" + (role === "admin" ? " admin" : "")}>{initialsOf(user.user_metadata?.full_name || user.email)}</div>
          <button className="btn line sm" onClick={() => window.netlifyIdentity.logout()}>Abmelden</button>
        </>) : (
          <button className="btn" onClick={() => window.netlifyIdentity.open("login")}>Anmelden</button>
        )}
      </div>
    </div></div>
  );
}

function Landing() {
  const login = () => window.netlifyIdentity.open("login");
  return (
    <div className="page">
      <section className="hero">
        <div className="kicker">Elevate Digital · eine Marke der Devic Industries</div>
        <h1 className="serif">Das Portal für unser Vertriebsteam.</h1>
        <p>Läden auf der Karte finden, Leads reservieren und den Status pflegen — und jede Provision
           transparent verfolgen. Ein Werkzeug für die ganze Crew.</p>
        <div className="hero-cta">
          <button className="btn" onClick={login}>Anmelden</button>
          <span style={{fontSize:"13px", color:"var(--muted)"}}>Zugang nur für Team-Mitglieder</span>
        </div>
      </section>
      <div className="feats">
        <div className="feat"><div className="no serif">Karte</div><h4>Läden finden</h4>
          <p>Suchen, auswählen, als Unternehmen übernehmen — mit Adresse und Standort.</p></div>
        <div className="feat"><div className="no serif">Leads</div><h4>Reservieren & pflegen</h4>
          <p>Status setzen, reservieren, für alle sichtbar. Kein Doppel-Ansprechen mehr.</p></div>
        <div className="feat"><div className="no serif">Provision</div><h4>Transparent abrechnen</h4>
          <p>Verkäufe eintragen, Provision nach Bestätigung, Live-Leaderboard.</p></div>
      </div>
    </div>
  );
}

/* ============================================================
   KARTE + LEADS  (Leaflet + Geoapify)
   ============================================================ */
function MapLeads({ myId, isAdmin }) {
  const mapDiv = useRef(null);
  const mapRef = useRef(null);
  const markerRef = useRef(null);
  const debounceRef = useRef(null);
  const [q, setQ] = useState("");
  const [suggestions, setSuggestions] = useState([]);
  const [selected, setSelected] = useState(null);
  const [leads, setLeads] = useState([]);
  const [noKey, setNoKey] = useState(false);
  const [meId, setMeId] = useState(myId);
  const [reserveDays, setReserveDays] = useState(3);
  const suppressUntil = useRef(0);
  const recentAdd = useRef({});
  const recentDel = useRef({});
  const touch = () => { suppressUntil.current = Date.now() + 5000; };

  const flash = (type, text) => pushToast(text, type === "err" ? "err" : type === "info" ? "info" : "ok");

  const loadLeads = useCallback(async () => {
    try {
      const j = await apiGet(LEADS_API);
      if (j.myId) setMeId(j.myId);
      if (j.reserveDays) setReserveDays(j.reserveDays);
      const now = Date.now();
      // kürzlich gelöschte noch kurz ausblenden (Server-Verzögerung)
      const server = (j.leads || []).filter(l => !(recentDel.current[l.id] && now - recentDel.current[l.id] < 15000));
      const ids = new Set(server.map(l => l.id));
      setLeads(prev => {
        // kürzlich hinzugefügte behalten, bis der Server sie listet
        const keep = prev.filter(l => !ids.has(l.id) && recentAdd.current[l.id] && now - recentAdd.current[l.id] < 15000);
        return [...keep, ...server];
      });
    } catch(e){ flash("err","Leads konnten nicht geladen werden."); }
  }, []);
  useEffect(() => { loadLeads(); }, [loadLeads]);
  useEffect(() => { const iv = setInterval(() => { if (Date.now() >= suppressUntil.current) loadLeads(); }, 20000); return () => clearInterval(iv); }, [loadLeads]);

  useEffect(() => {
    if (!GEOAPIFY_KEY || GEOAPIFY_KEY.indexOf("HIER_DEIN") === 0) { setNoKey(true); return; }
    if (!window.L || !mapDiv.current) return;
    const map = window.L.map(mapDiv.current).setView([50.2268, 8.618], 13);
    window.L.tileLayer(
      "https://maps.geoapify.com/v1/tile/osm-bright/{z}/{x}/{y}.png?apiKey=" + GEOAPIFY_KEY,
      { attribution: '© OpenStreetMap · © Geoapify', maxZoom: 20 }
    ).addTo(map);
    mapRef.current = map;
    setTimeout(() => map.invalidateSize(), 200);
    return () => { map.remove(); mapRef.current = null; };
  }, []);

  const onType = (text) => {
    setQ(text);
    if (debounceRef.current) clearTimeout(debounceRef.current);
    if (noKey || !text || text.trim().length < 3) { setSuggestions([]); return; }
    debounceRef.current = setTimeout(async () => {
      try {
        const url = "https://api.geoapify.com/v1/geocode/autocomplete?text=" + encodeURIComponent(text)
          + "&filter=countrycode:de&bias=proximity:8.618,50.2268&limit=6&lang=de&apiKey=" + GEOAPIFY_KEY;
        const r = await fetch(url);
        const j = await r.json();
        setSuggestions(j.features || []);
      } catch(e){ setSuggestions([]); }
    }, 300);
  };

  const pick = (f) => {
    const p = f.properties || {};
    const lat = p.lat, lng = p.lon;
    const raw = (p.datasource && p.datasource.raw) || {};
    const data = {
      placeId: p.place_id || (lat + "," + lng),
      name: p.name || p.address_line1 || p.formatted || "Unbenannt",
      address: p.formatted || "",
      phone: p["contact:phone"] || raw.phone || raw["contact:phone"] || "",
      lat, lng,
    };
    setSelected(data); setSuggestions([]); setQ(data.name);
    if (mapRef.current) {
      mapRef.current.setView([lat, lng], 16);
      if (markerRef.current) markerRef.current.remove();
      markerRef.current = window.L.marker([lat, lng]).addTo(mapRef.current);
    }
  };

  const selectBusiness = async () => {
    if (!selected) return;
    const payload = selected;
    setSelected(null); setQ(""); touch();
    try { const r = await apiSend(LEADS_API, "POST", payload);
      if (r && r.lead) { recentAdd.current[r.lead.id] = Date.now(); setLeads(prev => [r.lead, ...prev.filter(l => l.id !== r.lead.id)]); }
      pushToast("Unternehmen hinzugefügt ✓");
    } catch(e){ flash("err","Konnte nicht übernehmen."); }
  };
  const patchLead = async (id, changes) => {
    touch();
    setLeads(prev => prev.map(l => {
      if (l.id !== id) return l;
      const n = { ...l };
      if (changes.status !== undefined) n.status = changes.status;
      if (changes.website !== undefined) n.website = changes.website;
      if (changes.reserve === true) { n.reservedBy = { id: meId, name: "Du" }; n.reservedAt = Date.now(); }
      if (changes.reserve === false) { n.reservedBy = null; n.reservedAt = null; }
      return n;
    }));
    try { const r = await apiSend(LEADS_API, "PATCH", { id, ...changes }); if (r && r.lead) setLeads(prev => prev.map(l => l.id === id ? r.lead : l)); pushToast("Gespeichert ✓"); }
    catch(e){ flash("err", e.message || "Fehler."); loadLeads(); }
  };
  const removeLead = async (id) => {
    touch(); recentDel.current[id] = Date.now();
    setLeads(prev => prev.filter(l => l.id !== id));
    try { await apiSend(LEADS_API, "DELETE", null, "id="+encodeURIComponent(id)); pushToast("Gelöscht"); }
    catch(e){ flash("err", e.message || "Loeschen nicht erlaubt."); loadLeads(); }
  };

  const sorted = leads.slice().sort((a,b) => b.updatedAt - a.updatedAt);

  return (
    <div className="page">
      <div className="section-title"><h2 className="serif">Läden & Leads</h2>
        <span className="meta">{leads.length} Leads · für alle sichtbar</span></div>

      <div className="grid-map">
        <div className="card card-pad">
          <div className="eyebrow">Laden suchen</div>
          {noKey ? (
            <div className="banner info">Geoapify-Schlüssel fehlt noch. Hol dir kostenlos (ohne Kreditkarte) einen unter
              myprojects.geoapify.com und trag ihn oben in der <b>index.html</b> bei <code>GEOAPIFY_KEY</code> ein.</div>
          ) : (
            <div className="map-hint">Tippe einen Ladennamen oder eine Adresse, wähl den Treffer, dann „Unternehmen auswählen".</div>
          )}

          {!noKey && (
            <div className="search-box">
              <input value={q} placeholder="z. B. Pizzeria Da Enzo Bad Homburg"
                onChange={e => onType(e.target.value)} />
              {suggestions.length > 0 && (
                <div className="suggestions">
                  {suggestions.map((f,i) => (
                    <button type="button" key={(f.properties&&f.properties.place_id)||i} className="suggestion" onClick={() => pick(f)}>
                      <div className="s-name">{(f.properties&&(f.properties.name||f.properties.address_line1))||f.properties.formatted}</div>
                      <div className="s-addr">{f.properties&&f.properties.formatted}</div>
                    </button>
                  ))}
                </div>
              )}
            </div>
          )}

          <div id="map" ref={mapDiv} style={{ display: noKey ? "none":"block" }}></div>

          {selected && (
            <div className="place-panel">
              <h4>{selected.name}</h4>
              <div className="pp-meta">{selected.address}{selected.phone ? " · " + selected.phone : ""}</div>
              <div className="pp-actions">
                <button className="btn" onClick={selectBusiness}>Unternehmen auswählen</button>
                <button className="btn line" onClick={() => { setSelected(null); setQ(""); }}>Abbrechen</button>
              </div>
            </div>
          )}
        </div>

        <div className="card">
          <div className="card-head"><h3>Leads</h3><span className="hint">{leads.length} Einträge</span></div>
          <div className="card-pad">
            {sorted.length === 0 ? (
              <div className="empty"><div className="big serif">Noch keine Leads</div>
                <p>Such links einen Laden und übernimm ihn.</p></div>
            ) : sorted.map(l => (
              <LeadCard key={l.id} lead={l} myId={meId} reserveDays={reserveDays} isAdmin={isAdmin}
                onStatus={v => patchLead(l.id,{status:v})}
                onWebsite={v => patchLead(l.id,{website:v})}
                onReserve={() => patchLead(l.id,{reserve:true})}
                onFree={() => patchLead(l.id,{reserve:false})}
                onRemove={() => removeLead(l.id)} />
            ))}
          </div>
        </div>
      </div>
    </div>
  );
}

function LeadCard({ lead, myId, isAdmin, reserveDays, onStatus, onWebsite, onReserve, onFree, onRemove }) {
  const rb = lead.reservedBy;
  const active = !!(rb && lead.reservedAt && (Date.now() - lead.reservedAt) < (reserveDays||3)*86400000);
  const reserved = active ? rb : null;
  const mine = active && rb.id === myId;
  const owner = lead.createdBy || {};
  const canEdit = isAdmin || owner.id === myId;
  const daysLeft = active ? Math.max(0, Math.ceil((lead.reservedAt + (reserveDays||3)*86400000 - Date.now())/86400000)) : null;
  const resvLabel = active ? ((mine ? "Von dir reserviert" : "Reserviert · " + rb.name) + (daysLeft!=null ? " · noch " + daysLeft + (daysLeft===1?" Tag":" Tage") : "")) : "";
  return (
    <div className="lead">
      <div className="lead-top">
        <div>
          <div className="l-name">{lead.name}</div>
          <div className="l-meta">{lead.address}{lead.phone ? " · " + lead.phone : ""}</div>
        </div>
        <span className={"badge st-" + lead.status}>{LEAD_STATUS_LABEL[lead.status]}</span>
      </div>
      <div className="lead-tags">
        <span className="badge w">Website: {WEBSITE_LABEL[lead.website]}</span>
        {reserved && <span className={"resv" + (mine?" mine":"")}>{resvLabel}</span>}
        {owner.name && <span className="owner-tag">von {owner.name}</span>}
      </div>
      {canEdit ? (
        <div className="lead-controls">
          <div className="mini"><label>Status</label>
            <select value={lead.status} onChange={e => onStatus(e.target.value)}>
              {LEAD_STATUS.map(s => <option key={s.id} value={s.id}>{s.label}</option>)}
            </select></div>
          <div className="mini"><label>Website-Interesse</label>
            <select value={lead.website} onChange={e => onWebsite(e.target.value)}>
              {WEBSITE_OPTS.map(s => <option key={s.id} value={s.id}>{s.label}</option>)}
            </select></div>
          <div className="spacer"></div>
          {!reserved && <button className="btn sm" onClick={onReserve}>Reservieren</button>}
          {reserved && <button className="btn line sm" onClick={onFree}>Freigeben</button>}
          <button className="btn danger sm" onClick={onRemove}>Löschen</button>
        </div>
      ) : (
        <div className="lead-controls locked">Nur {owner.name || "der Ersteller"} kann diesen Lead bearbeiten.</div>
      )}
    </div>
  );
}

/* ============================================================
   PROVISIONEN (Verkäufe)
   ============================================================ */
function Leaderboard({ confirmed }) {
  const ranked = useMemo(() => {
    const map = {};
    (confirmed||[]).forEach(s => { const k=s.ownerName||"?"; if(!map[k])map[k]={name:k,revenue:0,deals:0}; map[k].revenue+=s.price; map[k].deals+=1; });
    return Object.values(map).sort((a,b)=>b.revenue-a.revenue);
  }, [confirmed]);
  return (
    <div className="card">
      <div className="card-head"><h3>Leaderboard</h3>
        <span className="hint">Bestätigter Umsatz · {new Date().toLocaleDateString("de-DE",{month:"long",year:"numeric"})}</span></div>
      <div className="card-pad" style={{paddingTop:6,paddingBottom:6}}>
        {ranked.length===0 ? (
          <div className="empty"><div className="big serif">Noch nichts bestätigt</div><p>Sobald der erste Abschluss bestätigt ist, erscheint er hier.</p></div>
        ) : ranked.map((r,i) => (
          <div key={r.name} className={"lb-row"+(i===0?" first":"")}>
            <div className="lb-rank">{i+1}</div><div className="avatar">{initialsOf(r.name)}</div>
            <div><div className="lb-name">{r.name}</div><div className="lb-sub">{r.deals} {r.deals===1?"Abschluss":"Abschlüsse"}</div></div>
            <div className="lb-fig"><div className="rev">{fmtEur(r.revenue)}</div></div>
          </div>
        ))}
      </div>
    </div>
  );
}

function SaleCard({ sale, view, onDone, onConfirm, onUnconfirm, onRemove }) {
  const st = SALE_STATUS[sale.status] || SALE_STATUS.open;
  const isConfirmed = sale.status === "confirmed";
  return (
    <div className="sale">
      <div className="sale-top">
        <div><div className="client">{sale.client}</div><div className="type">{TYPE_LABEL[sale.type]}</div></div>
        <div className="price">{fmtEur(sale.price)}</div>
      </div>
      <div className="sale-bottom">
        <div style={{display:"flex",alignItems:"center",gap:12,flexWrap:"wrap"}}>
          <span className={"badge "+st.cls}>{st.label}</span>
          {view==="admin" && <span className="who-tag">{sale.ownerName}</span>}
          {isConfirmed ? <span className="commission paid">Provision {fmtEur(commissionFor(sale))}</span>
                       : <span className="commission pending">Provision ausstehend</span>}
        </div>
        <div className="actions">
          {view==="affiliate" && sale.status==="open" && (<>
            <button className="btn ok sm" onClick={onDone}>Als abgeschlossen melden</button>
            <button className="btn danger sm" onClick={onRemove}>Löschen</button></>)}
          {view==="affiliate" && sale.status==="done" && (<span style={{fontSize:"12.5px",color:"var(--muted)"}}>Wartet auf Bestätigung</span>)}
          {view==="admin" && sale.status==="open" && (<button className="btn line sm" onClick={onDone}>Als abgeschlossen markieren</button>)}
          {view==="admin" && sale.status==="done" && (<button className="btn ok sm" onClick={onConfirm}>Bestätigen</button>)}
          {view==="admin" && sale.status==="confirmed" && (<button className="btn line sm" onClick={onUnconfirm}>Bestätigung widerrufen</button>)}
          {view==="admin" && (<button className="btn danger sm" onClick={onRemove}>Löschen</button>)}
        </div>
      </div>
    </div>
  );
}

function SaleForm({ addSale, websitePaused }) {
  const [client,setClient]=useState(""); const [type,setType]=useState(websitePaused ? "nfc" : "website");
  const [price,setPrice]=useState(""); const [err,setErr]=useState(""); const [busy,setBusy]=useState(false);
  useEffect(() => { if (websitePaused) setType("nfc"); }, [websitePaused]);
  const submit = async () => {
    const p = parseFloat(String(price).replace(",","."));
    if(websitePaused && type!=="nfc") return setErr("Website-Verkauf ist gerade pausiert.");
    if(!client.trim()) return setErr("Bitte Kundennamen eintragen.");
    if(!p||p<=0) return setErr("Bitte einen gültigen Verkaufspreis eintragen.");
    setErr(""); setBusy(true);
    try { await addSale({client:client.trim(),type,price:Math.round(p)}); setClient(""); setPrice(""); setType(websitePaused ? "nfc" : "website"); }
    catch(e){ setErr("Speichern fehlgeschlagen."); } finally { setBusy(false); }
  };
  return (
    <div className="card card-pad" style={{position:"sticky",top:84}}>
      <div className="eyebrow">Verkauf eintragen</div>
      <div className="field"><label>Kunde</label>
        <input value={client} placeholder="z. B. Pizzeria Da Enzo" onChange={e=>setClient(e.target.value)} /></div>
      <div className="field"><label>Art des Verkaufs</label>
        <select value={type} onChange={e=>setType(e.target.value)}>
          {TYPES.map(t=><option key={t.id} value={t.id} disabled={websitePaused && t.id!=="nfc"}>{t.label} ({t.rate}){websitePaused && t.id!=="nfc" ? " — pausiert" : ""}</option>)}</select>
        {websitePaused && <div style={{fontSize:12, color:"var(--amber)", marginTop:6}}>Website-Verkauf pausiert — aktuell nur NFC-Aufsteller wählbar.</div>}</div>
      <div className="field"><label>Verkaufspreis (netto)</label>
        <input value={price} inputMode="decimal" placeholder="z. B. 700"
          onChange={e=>setPrice(e.target.value)} onKeyDown={e=>e.key==="Enter"&&submit()} /></div>
      {err && <div className="err">{err}</div>}
      <button className="btn" style={{width:"100%",justifyContent:"center",marginTop:6}} onClick={submit} disabled={busy}>{busy?"Speichert…":"Eintragen"}</button>
      <p style={{fontSize:"12px",color:"var(--muted)",marginTop:12,lineHeight:1.5}}>Deine Provision erscheint, sobald der Abschluss bestätigt wurde.</p>
    </div>
  );
}

function AffiliateDashboard({ user, data, addSale, setStatus, removeSale, websitePaused }) {
  const mine = (data.mine||[]).slice().sort((a,b)=>b.createdAt-a.createdAt);
  const confirmed = mine.filter(s=>s.status==="confirmed");
  const revenue = confirmed.reduce((s,x)=>s+x.price,0);
  const commission = confirmed.reduce((s,x)=>s+commissionFor(x),0);
  const pending = mine.filter(s=>s.status!=="confirmed").length;
  return (
    <div className="page">
      <div className="section-title"><h2 className="serif">Willkommen, {user.user_metadata?.full_name || user.email}.</h2></div>
      <div className="stat-grid">
        <div className="stat"><div className="lab">Bestätigter Umsatz</div><div className="num blue">{fmtEur(revenue)}</div><div className="foot">{confirmed.length} bestätigte Abschlüsse</div></div>
        <div className="stat"><div className="lab">Deine Provision</div><div className="num green">{fmtEur(commission)}</div><div className="foot">freigegeben</div></div>
        <div className="stat"><div className="lab">In Bearbeitung</div><div className="num amber">{pending}</div><div className="foot">offen oder wartet auf Bestätigung</div></div>
      </div>
      <div className="grid-2" style={{marginTop:24}}>
        <SaleForm addSale={addSale} websitePaused={websitePaused} />
        <div>
          <div className="card" style={{marginBottom:20}}>
            <div className="card-head"><h3>Meine Verkäufe</h3><span className="hint">{mine.length} Einträge</span></div>
            <div className="card-pad">
              {mine.length===0 ? (<div className="empty"><div className="big serif">Noch keine Verkäufe</div><p>Trage links deinen ersten Abschluss ein.</p></div>)
                : mine.map(s => <SaleCard key={s.id} sale={s} view="affiliate" onDone={()=>setStatus(s.id,"done")} onRemove={()=>removeSale(s.id)} />)}
            </div>
          </div>
          <Leaderboard confirmed={data.board} />
        </div>
      </div>
    </div>
  );
}

function AdminDashboard({ data, setStatus, removeSale }) {
  const [filter,setFilter]=useState("all");
  const sales = data.sales || [];
  const confirmed = sales.filter(s=>s.status==="confirmed");
  const totalRevenue = confirmed.reduce((s,x)=>s+x.price,0);
  const totalCommission = confirmed.reduce((s,x)=>s+commissionFor(x),0);
  const awaiting = sales.filter(s=>s.status==="done").length;
  const counts = { all:sales.length, done:awaiting, open:sales.filter(s=>s.status==="open").length, confirmed:confirmed.length };
  const order = { done:0, open:1, confirmed:2 };
  const filtered = sales.filter(s=>filter==="all"?true:s.status===filter)
    .sort((a,b)=>order[a.status]!==order[b.status]?order[a.status]-order[b.status]:b.createdAt-a.createdAt);
  return (
    <div className="page">
      <div className="section-title"><h2 className="serif">Admin · Übersicht</h2><span className="meta">Alle Verkäufe des Teams</span></div>
      <div className="stat-grid">
        <div className="stat"><div className="lab">Bestätigter Umsatz</div><div className="num blue">{fmtEur(totalRevenue)}</div><div className="foot">{confirmed.length} Abschlüsse</div></div>
        <div className="stat"><div className="lab">Provision (Auszahlung)</div><div className="num green">{fmtEur(totalCommission)}</div><div className="foot">freigegeben ans Team</div></div>
        <div className="stat"><div className="lab">Wartet auf Bestätigung</div><div className="num amber">{awaiting}</div><div className="foot">abgeschlossen, ungeprüft</div></div>
        <div className="stat"><div className="lab">Einträge gesamt</div><div className="num">{sales.length}</div><div className="foot">alle Status</div></div>
      </div>
      <div className="grid-2" style={{marginTop:24}}>
        <Leaderboard confirmed={confirmed} />
        <div className="card">
          <div className="card-head"><h3>Verkäufe verwalten</h3>
            <div className="filters">
              {[["all","Alle"],["done","Zu bestätigen"],["open","Offen"],["confirmed","Bestätigt"]].map(([k,l])=>(
                <button key={k} className={"chip"+(filter===k?" on":"")} onClick={()=>setFilter(k)}>{l} · {counts[k]}</button>))}
            </div>
          </div>
          <div className="card-pad">
            {filtered.length===0 ? (<div className="empty"><div className="big serif">Nichts hier</div><p>{sales.length===0?"Sobald das Team Verkäufe einträgt, erscheinen sie hier.":"Kein Eintrag mit diesem Status."}</p></div>)
              : filtered.map(s => <SaleCard key={s.id} sale={s} view="admin" onDone={()=>setStatus(s.id,"done")} onConfirm={()=>setStatus(s.id,"confirmed")} onUnconfirm={()=>setStatus(s.id,"done")} onRemove={()=>removeSale(s.id)} />)}
          </div>
        </div>
      </div>
    </div>
  );
}

/* ============================================================ */
function Capacity({ cap, loadCap, isAdmin, myId }) {
  const [localCap, setLocalCap] = useState(cap || null);
  const [meId, setMeId] = useState(myId);
  const [loadErr, setLoadErr] = useState(false);
  const [wNote, setWNote] = useState("");
  const [nfcNote, setNfcNote] = useState("");
  const [given, setGiven] = useState({});
  const [myLeft, setMyLeft] = useState("");

  const reload = useCallback(async () => {
    setLoadErr(false);
    try { const j = await apiGet(CAP_API); setLocalCap(j.data); if (j.myId) setMeId(j.myId); }
    catch(e){ setLoadErr(true); }
  }, []);
  useEffect(() => { reload(); }, [reload]);

  const c = localCap;
  useEffect(() => {
    if (!c) return;
    setWNote(c.websiteNote || "");
    setNfcNote(c.nfcNote || "");
    const g = {}; Object.keys(c.tags||{}).forEach(id => g[id] = String((c.tags[id].given)||0));
    setGiven(g);
    if (c.tags && c.tags[meId]) setMyLeft(String(c.tags[meId].left||0));
  }, [c, meId]);

  const send = async (payload) => {
    // Optimistisch sofort anwenden (ein Klick reicht)
    setLocalCap(prev => {
      if (!prev) return prev;
      const n = { ...prev, tags: { ...(prev.tags||{}) } };
      if (payload.type === "website") { n.websitePaused = !!payload.paused; if (payload.note !== undefined) n.websiteNote = payload.note; }
      else if (payload.type === "nfc") { n.nfcNote = payload.note || ""; }
      else if (payload.type === "given") { n.tags[payload.userId] = { ...(n.tags[payload.userId]||{}), given: parseInt(payload.given,10)||0, name: payload.name || (n.tags[payload.userId]||{}).name }; }
      else if (payload.type === "mytags") { const cur = n.tags[meId]||{}; n.tags[meId] = { ...cur, left: payload.left!==undefined ? (parseInt(payload.left,10)||0) : cur.left, needMore: payload.needMore!==undefined ? !!payload.needMore : cur.needMore }; }
      return n;
    });
    try { const r = await apiSend(CAP_API, "PATCH", payload); if (r && r.data) setLocalCap(r.data); pushToast("Gespeichert ✓"); loadCap(); }
    catch(e){ pushToast("Fehler beim Speichern","err"); reload(); }
  };

  if (loadErr && !c) return <div className="page"><div className="center-state"><div><div style={{marginBottom:14, color:"var(--ink-2)"}}>Kapazität konnte nicht geladen werden.</div><button className="btn" onClick={reload}>Erneut versuchen</button></div></div></div>;
  if (!c) return <div className="page"><div className="center-state"><div><div className="spinner"></div>Lädt…</div></div></div>;

  const tags = c.tags || {};
  const mine = tags[meId] || { given:0, left:0, needMore:false };

  return (
    <div className="page">
      <div className="section-title"><h2 className="serif">Kapazität</h2></div>
      {isAdmin ? (
        <div style={{display:"grid", gap:20}}>
          <div className="card card-pad">
            <div className="eyebrow">Website-Verkauf</div>
            <div style={{display:"flex", alignItems:"center", gap:14, flexWrap:"wrap"}}>
              <span className={"badge " + (c.websitePaused ? "st-nicht_interessiert" : "st-verkauft")}>{c.websitePaused ? "Pausiert" : "Aktiv"}</span>
              <button className={"btn sm " + (c.websitePaused ? "ok" : "danger")}
                onClick={() => send({ type:"website", paused: !c.websitePaused, note: wNote })}>
                {c.websitePaused ? "Wieder aktivieren" : "Verkauf pausieren"}</button>
            </div>
            <div className="field" style={{marginTop:14}}><label>Hinweis (z. B. „keine Kapazität bis 15.09.")</label>
              <input value={wNote} onChange={e=>setWNote(e.target.value)} placeholder="Grund / bis wann" /></div>
            <button className="btn sm line" onClick={()=>send({type:"website", paused:c.websitePaused, note:wNote})}>Hinweis speichern</button>
          </div>

          <div className="card card-pad">
            <div className="eyebrow">NFC-Tags · Nachschub</div>
            <div className="field"><label>Hinweis fürs Team (z. B. „Neue Tags ab 20.09. da")</label>
              <input value={nfcNote} onChange={e=>setNfcNote(e.target.value)} placeholder="Wann kommen neue Tags?" /></div>
            <button className="btn sm line" onClick={()=>send({type:"nfc", note:nfcNote})}>Speichern</button>
          </div>

          <div className="card">
            <div className="card-head"><h3>Tags pro Person</h3><span className="hint">{Object.keys(tags).length} im Team</span></div>
            <div className="card-pad">
              {Object.keys(tags).length===0 ? (<div className="empty"><p>Sobald sich jemand einloggt, erscheint er hier.</p></div>) :
                Object.keys(tags).map(id => {
                  const t = tags[id];
                  return (
                    <div className="lead" key={id}>
                      <div className="lead-top"><div className="l-name">{t.name || "Unbekannt"}</div>
                        {t.needMore && <span className="badge st-nicht_interessiert">braucht neue</span>}</div>
                      <div className="lead-controls">
                        <div className="mini"><label>Ausgegeben</label>
                          <input style={{width:90}} inputMode="numeric" value={given[id] ?? ""} onChange={e=>setGiven({...given, [id]:e.target.value})} /></div>
                        <div className="mini"><label>Übrig (Partner)</label><div style={{padding:"7px 0", fontWeight:600}}>{t.left||0}</div></div>
                        <div className="spacer"></div>
                        <button className="btn sm" onClick={()=>send({type:"given", userId:id, given:given[id], name:t.name})}>Speichern</button>
                      </div>
                    </div>
                  );
                })}
            </div>
          </div>
        </div>
      ) : (
        <div style={{display:"grid", gap:20}}>
          <div className="card card-pad">
            <div className="eyebrow">Aktueller Status</div>
            <div style={{display:"flex", flexDirection:"column", gap:10}}>
              <div>Website-Verkauf: <span className={"badge " + (c.websitePaused ? "st-nicht_interessiert" : "st-verkauft")}>{c.websitePaused ? "Pausiert" : "Aktiv"}</span>
                {c.websitePaused && c.websiteNote ? <span style={{color:"var(--muted)", fontSize:13}}> — {c.websiteNote}</span> : null}</div>
              {c.nfcNote ? <div style={{fontSize:14}}>NFC-Nachschub: <b>{c.nfcNote}</b></div> : null}
            </div>
          </div>
          <div className="card card-pad">
            <div className="eyebrow">Meine NFC-Tags</div>
            <div style={{display:"flex", gap:24, flexWrap:"wrap", alignItems:"flex-end"}}>
              <div><div style={{fontSize:11.5, color:"var(--muted)", fontWeight:600, textTransform:"uppercase"}}>Erhalten</div>
                <div style={{fontFamily:"'Source Serif 4',serif", fontSize:28, fontWeight:700}}>{mine.given||0}</div></div>
              <div className="field" style={{marginBottom:0}}><label>Noch übrig</label>
                <input style={{width:110}} inputMode="numeric" value={myLeft} onChange={e=>setMyLeft(e.target.value)} /></div>
              <label style={{display:"flex", alignItems:"center", gap:8, fontSize:14}}>
                <input type="checkbox" checked={!!mine.needMore} onChange={e=>send({type:"mytags", left:myLeft, needMore:e.target.checked})} /> Ich brauche neue</label>
            </div>
            <button className="btn sm" style={{marginTop:14}} onClick={()=>send({type:"mytags", left:myLeft, needMore:mine.needMore})}>Aktualisieren</button>
          </div>
        </div>
      )}
    </div>
  );
}
function App() {
  const [ready,setReady]=useState(false);
  const [user,setUser]=useState(null);
  const [data,setData]=useState(null);
  const [role,setRole]=useState(null);
  const [err,setErr]=useState("");
  const [tab,setTab]=useState("karte");
  const [cap,setCap]=useState(null);

  const refresh = useCallback(async () => {
    try { setErr(""); const j = await apiGet(SALES_API); setRole(j.role); setData(j); }
    catch(e){ setErr("Verkaufsdaten konnten nicht geladen werden ("+e.message+")."); }
  }, []);
  const loadCap = useCallback(async () => {
    try { const j = await apiGet(CAP_API); setCap(j.data); } catch(e){}
  }, []);

  useEffect(() => {
    const ni = window.netlifyIdentity;
    if(!ni){ setErr("Login-System nicht geladen."); setReady(true); return; }
    ni.on("init", u => { setUser(u); setReady(true); if(u){ refresh(); loadCap(); } });
    ni.on("login", u => { setUser(u); ni.close(); refresh(); loadCap(); });
    ni.on("logout", () => { setUser(null); setData(null); setRole(null); setCap(null); });
    ni.init();
  }, [refresh, loadCap]);

  useEffect(() => {
    if (!user) return;
    const iv = setInterval(() => loadCap(), 45000);
    return () => clearInterval(iv);
  }, [user, loadCap]);

  const addSale=async(s)=>{ await apiSend(SALES_API,"POST",s); pushToast("Verkauf eingetragen ✓"); refresh(); };
  const setStatus=async(id,status)=>{ await apiSend(SALES_API,"PATCH",{id,status}); pushToast("Gespeichert ✓"); refresh(); };
  const removeSale=async(id)=>{ await apiSend(SALES_API,"DELETE",null,"id="+encodeURIComponent(id)); pushToast("Gelöscht"); refresh(); };

  let body;
  if(!ready){ body=<div className="center-state"><div><div className="spinner"></div>Lädt…</div></div>; }
  else if(!user){ body=<Landing />; }
  else if(!data){ body=<div className="center-state"><div><div className="spinner"></div>{err?<div style={{color:"var(--red)",fontSize:14}}>{err}</div>:"Deine Daten werden geladen…"}</div></div>; }
  else {
    body = <>
      <div className="page" style={{paddingTop:16,paddingBottom:0}}>
        {err && <div className="banner">{err}</div>}
        {cap && cap.websitePaused && <div className="banner info" style={{marginBottom:12}}>Website-Verkauf pausiert{cap.websiteNote ? " — " + cap.websiteNote : ""}</div>}
        <div className="tabs">
          <button className={"tab"+(tab==="karte"?" on":"")} onClick={()=>setTab("karte")}>Karte</button>
          <button className={"tab"+(tab==="provisionen"?" on":"")} onClick={()=>setTab("provisionen")}>Provisionen</button>
          <button className={"tab"+(tab==="kapazitaet"?" on":"")} onClick={()=>setTab("kapazitaet")}>Kapazität</button>
        </div>
      </div>
      {tab==="karte"
        ? <MapLeads myId={user.id} isAdmin={role==="admin"} />
        : tab==="kapazitaet"
        ? <Capacity cap={cap} loadCap={loadCap} isAdmin={role==="admin"} myId={user.id} />
        : (role==="admin"
            ? <AdminDashboard data={data} setStatus={setStatus} removeSale={removeSale} />
            : <AffiliateDashboard user={user} data={data} addSale={addSale} setStatus={setStatus} removeSale={removeSale} websitePaused={cap && cap.websitePaused} />)}
    </>;
  }

  return (<>
    <Toaster />
    <Topbar user={user} role={role} />
    {body}
    <footer className="site"><div className="in">
      <span>© {new Date().getFullYear()} Elevate Digital — eine Marke der Devic Industries</span>
      <span>Bad Homburg · Frankfurt</span>
    </div></footer>
  </>);
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
